@version 1
@module_missing skip
@test registry
@test priority module=test_priority.mo timeout_ticks=500
@test remote_enqueue module=test_remote_enqueue.mo timeout_ticks=200
@test rcu_publish module=test_rcu_publish.mo rounds=16 timeout_ticks=1000
@test ipi_delivery module=test_ipi_delivery.mo rounds=50 timeout_ticks=500
@test cpu_alive module=test_cpu_alive.mo timeout_ticks=100
@test smp_tlb_remap module=test_tlb.mo rounds=4
@test fpu_context module=test_fpu_context.mo rounds=50
@test fpu_arm64 module=test_fpu_arm64.mo rounds=50
@test sched_stress module=test_sched_stress.mo rounds=200 workers=4 timeout_ticks=5000
@test rcu_stress module=test_rcu_stress.mo rounds=100 readers=4 timeout_ticks=2000

# CPU	MODULE			TYPE	MAGIC	[ARGS...]
# Compatibility-only superset. Architecture-specific payloads are skipped
# when absent; normal x86_64 startup uses task-base.conf plus test.conf.
0	user.elf:user0.0		3	0xc	1 10
0	module_foo.mo:foo		1	0xa	count=2 tick=10
0	module_abi.mo:abi		1	0xb

1	user.elf:user1.0		3	0xc	1 10
1	thread_bar.elf:bar		2	0xb		# x86 only; params require a separate boot
1	user.elf:user1.1		3	0xc	2 10
1	module_foo.mo:foo		1	0xa	count=3 tick=3

2	user.elf:user2.0		3	0xc	2 10
2	e1000.mo:e1000			1	0xa	g_idle_mode=1
2	module_foo.mo:foo		1	0xa	count=4 tick=4

3	user.elf:user3.0		3	0xc	3 10
3	user.elf:user3.1		3	0xc	4 10
3	user.elf:user3.2		3	0xc	5 10
3	module_foo.mo:foo		1	0xa	count=5 tick=5
