@version 1
@module_missing panic

# Base initrd: no @test directives or test payloads.
# Only CPU0 is required; this bundle is usable with single-CPU boot too.
0 user.elf:init           3 0xc 1 10
0 module_foo.mo:worker    1 0xa count=2 tick=10

# e1000.mo is packaged as an available base component, but not started here.
# Device/service readiness and network startup are separate policy decisions.
